name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -t . -v
      - name: API endpoint tests (FastAPI TestClient, fake Supabase + weather)
        run: python -m unittest discover -s tests_api -t . -v
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Offline queue tests
        run: node --test tests_js/queue.test.js
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Real-database behaviour tests (migrations, RLS, triggers)
        run: bash tests_sql/run.sh
